name: Android Kotlin APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "github-manager.json"
      - ".github/workflows/android-kotlin-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Validate GitHub Manager metadata
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          metadata = json.loads(Path("github-manager.json").read_text(encoding="utf-8"))
          gradle = Path("app/build.gradle.kts").read_text(encoding="utf-8")

          version_name = re.search(r'versionName\s*=\s*"([^"]+)"', gradle).group(1)
          version_code = int(re.search(r'versionCode\s*=\s*(\d+)', gradle).group(1))

          assert metadata["versionName"] == version_name, (metadata["versionName"], version_name)
          assert int(metadata["versionCode"]) == version_code, (metadata["versionCode"], version_code)
          print(f"Versão validada: {version_name} ({version_code})")
          PY

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Relogio-Flutuante.apk
          test -s release/Relogio-Flutuante.apk

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("github-manager.json", encoding="utf-8"))["versionName"])')
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}-${RUN_NUMBER}"
          TITLE="Relógio Flutuante v${VERSION}"
          APK="release/Relogio-Flutuante.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG já existe; atualizando APK."
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "$TITLE" --latest
          else
            echo "Criando release $TAG."
            gh release create "$TAG" "$APK" \
              --title "$TITLE" \
              --notes "APK Android do Relógio Flutuante v${VERSION}." \
              --latest
          fi
