name: Android Kotlin APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "github-manager.json"
      - ".github/workflows/android-kotlin-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Validate GitHub Manager metadata
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          metadata = json.loads(Path("github-manager.json").read_text(encoding="utf-8"))
          gradle = Path("app/build.gradle.kts").read_text(encoding="utf-8")

          version_name = re.search(r'versionName\s*=\s*"([^"]+)"', gradle).group(1)
          version_code = int(re.search(r'versionCode\s*=\s*(\d+)', gradle).group(1))

          assert metadata["versionName"] == version_name, (metadata["versionName"], version_name)
          assert int(metadata["versionCode"]) == version_code, (metadata["versionCode"], version_code)
          print(f"Versão validada: {version_name} ({version_code})")
          PY

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Relogio-Flutuante.apk

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("github-manager.json", encoding="utf-8"))["versionName"])')
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}-${{ github.run_number }}
          name: Relógio Flutuante v${{ steps.version.outputs.name }}
          files: release/Relogio-Flutuante.apk
          fail_on_unmatched_files: true
          make_latest: true
